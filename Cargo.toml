[workspace]
members = [
  "quill-stroke",
  "quill-canvas",
  "quill-app",
  "quill-render-bevy",
  "quill-render-imaging",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
async-channel = "2.5.0"
bevy = { version = "0.18.1", features = ["debug"] }
bevy_asset = "0.18.1"
bevy_ecs = "0.18.1"
bevy_reflect = "0.18.1"
bitflags = "2.11.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
futures-lite = "2.6.1"
ordered-float = { version = "5.3.0", features = ["bytemuck"] }
peniko = "0.6.0"
pollster = "0.4.0"
slint = { git = "https://github.com/slint-ui/slint", branch = "feature/winit-0.31", default-features = false, features = [
  "backend-winit",
  "compat-1-2",
  "renderer-skia",
  "std",
  "unstable-wgpu-27",
  "unstable-winit-031",
] }
slint-build = { git = "https://github.com/slint-ui/slint", branch = "feature/winit-0.31" }
smallvec = "1.15.1"
spin_on = "0.1"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
vello_api = { path = "../vello/sparse_strips/vello_api", default-features = true }
vello_common = { path = "../vello/sparse_strips/vello_common", default-features = true }
vello_hybrid = { path = "../vello/sparse_strips/vello_hybrid", default-features = false, features = [
  "wgpu",
  "wgpu_default",
] }
wgpu = "27.0.1"
winit = { git = "https://github.com/rust-windowing/winit", branch = "v0.31.x" }
