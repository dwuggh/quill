[workspace]
members = [
  "quill-stroke",
  "quill-canvas",
  "quill-app",
  "quill-playground",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
bytemuck = { version = "1.25.0", features = ["derive"] }
nalgebra = { version = "0.34.2", features = ["bytemuck", "convert-glam030"] }
ordered-float = { version = "5.3.0", features = ["bytemuck"] }
pollster = "0.4.0"
smallvec = "1.15.1"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wgpu = "29.0.3"
winit = { git = "https://github.com/rust-windowing/winit", branch = "v0.31.x" }
