[workspace]
members = [
  "quill-stroke",
  "quill-canvas",
  "quill-render-bevy",
  "quill-render-imaging",
  "quill-app-xilem",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-channel = "2.5.0"
bevy = { version = "0.19.1", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_camera",
  "bevy_color", "bevy_core_pipeline", "bevy_image", "bevy_mesh", "bevy_render",
  "bevy_shader", "bevy_window", "debug",
] }
bevy_asset = "0.19.1"
bevy_ecs = "0.19.1"
bevy_reflect = "0.19.1"
bitflags = "2.13.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
futures-lite = "2.6.1"
imaging = "0.0.1"
ordered-float = { version = "5.5.0", features = ["bytemuck"] }
peniko = "0.6.1"
smallvec = "1.16.2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Match Bevy's WGPU version because the offscreen renderer shares its GPU handles.
wgpu = "29.0.4"
# The sibling checkout carries Winit 0.31 tablet input support.
xilem = { path = "../xilem/xilem", default-features = false, features = ["imaging_vello_hybrid"] }
