[workspace]
members = [
  "quill-stroke",
  "quill-canvas",
  "quill-render-bevy",
  "quill-render-imaging",
  "quill-app-xilem",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
async-channel = "2.5.0"
bevy = { version = "0.18.1", features = ["debug"] }
bevy_asset = "0.18.1"
bevy_ecs = "0.18.1"
bevy_reflect = "0.18.1"
bitflags = "2.11.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
futures-lite = "2.6.1"
ordered-float = { version = "5.3.0", features = ["bytemuck"] }
peniko = "0.6.0"
smallvec = "1.15.1"
spin_on = "0.1"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wgpu = "27.0.1"
winit = { git = "https://github.com/rust-windowing/winit", branch = "v0.31.x" }
